# Checks of every pull request to main, and of main after each merge. The copy from Overtable's private
# repository arrives as a pull request and merges on its own once these two jobs pass: they are the required
# status checks of the ruleset protect-main ("scan" and "build, test, pack"). Keep the job names.
#
#   scan                gitleaks over the tree (pinned version, checksum checked), then
#                       scripts/publish/check-public.mjs: no import of a workspace that is not in this
#                       repository, no personal names, no plans and no dates in the docs.
#   build, test, pack   npm ci, the TypeScript build, the tests, then each package staged, packed with npm pack,
#                       installed outside the checkout and type-checked (scripts/publish/dry-run.mjs --no-relay).
#
# GitHub-hosted runners only, read-only token, no secret: safe for pull requests from forks.
name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      GITLEAKS_ASSET_ID: 378332058
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install gitleaks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
      - name: Secret scan of the tree
        # --redact keeps any value out of the log.
        run: $RUNNER_TEMP/gitleaks/gitleaks dir --redact --no-banner --verbose --exit-code 1 .
      - name: Private imports, names, roadmap, dates
        run: node scripts/publish/check-public.mjs .

  build:
    name: build, test, pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Stage, npm pack, install outside the checkout, type-check
        run: node scripts/publish/dry-run.mjs --skip-tsc --no-relay
